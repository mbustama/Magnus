[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX `license` expression below.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI.  The import package stays `magnus` (see
# [tool.setuptools.packages.find] below); the two are independent, and plain
# `magnus` was already taken on PyPI by an unrelated project.
name = "magnuspy"
version = "1.0.0"
description = "Neutrino oscillation probabilities via the Magnus expansion, for an arbitrary number of flavors and any Hamiltonian, time-dependent or not."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
    {name = "Mauricio Bustamante", email = "mbustamante@gmail.com"}
]
classifiers = [
    # 5, not 4: this is 1.0.0, and "Beta" is the first thing a visitor reads on the PyPI
    # page.  The two have to agree, or the page argues with itself about how finished the
    # project is.
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    # Only the versions CI actually runs.  These are what PyPI filters on, so a version
    # listed here is a promise that something tested it; 3.13 joins the list when the
    # matrix job for it has been green, not before.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "joblib>=1.2",
    "matplotlib>=3.5"
]

[project.optional-dependencies]
plot = []          # matplotlib is a base dependency; kept so `magnuspy[plot]` still resolves

# numba powers the Cayley-Hamilton matrix-exponential backend (magnus.expmkernels),
# which is worth about 6x on a slab chain of 2x2 or 3x3 matrices.  Optional, and
# deliberately so: without it `EXPM_BACKEND = 'auto'` silently uses numpy.linalg.eigh
# and every result is the same to ~1e-15, so nothing but speed depends on it.
#
# It is listed in `test` as well, so that CI exercises the kernel rather than skipping
# every test of it.  numba caps the numpy version it supports, so this does let the
# resolver hold numpy back a minor release; that is accepted because the alternative is
# shipping a compiled numerical kernel no CI job ever runs.
fast = ["numba>=0.59"]
test = ["pytest", "pytest-cov", "pytest-xdist", "matplotlib>=3.5", "numba>=0.59"]
dev = ["pytest", "pytest-cov", "pytest-xdist", "twine", "build", "ruff",
       "matplotlib>=3.5", "numba>=0.59"]
notebooks = ["nbformat", "nbclient", "ipykernel", "matplotlib>=3.5", "scipy"]
docs = ["sphinx", "sphinx-autoapi", "sphinx-rtd-theme", "sphinx-copybutton", "sphinxcontrib-bibtex", "sphinxcontrib-mermaid", "myst-parser", "jupyter-sphinx", "ipykernel", "matplotlib>=3.5"]

[project.scripts]
magnus = "magnus.cli:main"

[project.urls]
Homepage = "https://github.com/mbustama/Magnus"
Repository = "https://github.com/mbustama/Magnus.git"
Issues = "https://github.com/mbustama/Magnus/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561.  The public API is annotated -- 18 of the 19 parameters on
# `osc_prob_3nu_vacuum`, and similarly throughout -- but without this marker file in the
# installed package, mypy and pyright treat magnuspy as untyped and discard every one of
# those annotations.  The file is empty by design; its presence is the whole signal.
[tool.setuptools.package-data]
magnus = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

# jupyter-sphinx writes the executed source of every `.. jupyter-execute::` block
# into docs/jupyter_execute/.  It is generated, and the documented lint command
# names docs/ explicitly, so without this an ordinary `make html` followed by
# `ruff check` reports a couple of hundred errors in code nobody wrote.  Passing a
# path explicitly overrides gitignore discovery, so ignoring it in .gitignore is
# not enough on its own.
extend-exclude = ["docs/jupyter_execute"]

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's default.  The default selection is not
# stable across ruff releases -- 0.16 widened it, which turned a green CI red overnight on
# a codebase that had not changed -- and a blocking lint whose rule set moves with whatever
# version CI happens to install is not a check, it is a tripwire.  This is the set the
# codebase was cleaned against: pycodestyle errors and Pyflakes.
select = ["E4", "E7", "E9", "F"]

# Two checks flag deliberate, codebase-wide conventions rather than defects.
ignore = [
    # `l` is the standard symbol for position along the neutrino trajectory in the physics
    # this package implements; renaming it everywhere would make the code harder to read
    # against the equations in docs/source/methodology.rst.
    "E741",
    # Single-statement guards on one line (`if save_log: file_log.close()`) are used
    # consistently here, and only ever for short cleanup or clamping statements.
    "E701",
]

[tool.ruff.lint.per-file-ignores]
# The package __init__ deliberately re-exports its submodules; `__all__` is built from a
# list of strings, which ruff cannot connect back to the import statements.
"src/magnus/__init__.py" = ["F401"]
# oscprob re-exports oscprobstd's closed-form helpers at the end of the module, next to
# the `__all__` they belong to rather than at the top.
"src/magnus/oscprob.py" = ["E402"]
# conf.py must extend sys.path before it can import the package's version module.
"docs/source/conf.py" = ["E402"]
# Throwaway lambdas are idiomatic when building a one-off callable for a single assertion.
"tests/*" = ["E731"]

[tool.coverage.run]
# `magnus` is the import package; `magnuspy` is only the distribution name, and coverage
# measures imported source, so the directory below is what it has to be pointed at.
source = ["src/magnus"]

# Branch coverage, not just line coverage.  Line coverage flatters this codebase badly:
# oscprob.py is ~15k lines, of which some 60 are near-identical thin wrappers that a single
# parametrized test sweeps in one go.  What is actually worth knowing is whether the
# dispatch chain (ip_exp -> hybrid -> scan_separable -> general), the refinement caps and
# the warning paths are each exercised in both directions, and only branch coverage
# reports that.
branch = true

# `python -m magnus` is a two-line delegation to cli.main, guarded by `if __name__ ==
# "__main__"`, which is by construction never true under pytest.  Counting it would report
# a permanent miss that no test can ever close.
omit = ["src/magnus/__main__.py"]

[tool.coverage.report]
show_missing = true

# A floor, not a target, and one that only ever moves up: the suite measures 92%, so this
# holds the ground already gained without failing on noise.  Coverage is not perfectly
# reproducible -- a test taking a different dispatch path on a different interpreter moves
# the total by a fraction of a percent -- and a threshold pinned at exactly the current
# number fails on that jitter rather than on a regression.  Two points of headroom
# tolerates the jitter while still catching what this is for: an untested module added, or
# a test file deleted.
#
# It was deliberately left unset until now.  A threshold chosen before the first
# measurement either sits below the real number and never fires, or above it and blocks
# unrelated work; the number worth pinning is one the suite has actually reached.
#
# Raise it when coverage climbs and stays there.  Never lower it to make a red build
# green -- at that point it stops being a floor and merely certifies whatever happened to
# be true.
#
# Note this applies to every coverage run, not just CI, so measuring a single test file
# reports far below 90 and exits non-zero.  Pass --cov-fail-under=0 for that.
fail_under = 90

exclude_also = [
    # Import-time guards for running a module as a script; unreachable under pytest.
    "if __name__ == .__main__.:",
]
