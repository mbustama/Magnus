[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX `license` expression below.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI.  The import package stays `magnus` (see
# [tool.setuptools.packages.find] below); the two are independent, and plain
# `magnus` was already taken on PyPI by an unrelated project.
name = "magnuspy"
version = "1.0.0rc1"
description = "Neutrino oscillation probabilities via the Magnus expansion, for an arbitrary number of flavors and any Hamiltonian, time-dependent or not."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
    {name = "Mauricio Bustamante", email = "mbustamante@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "joblib>=1.2"
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "twine", "build", "ruff"]
docs = ["sphinx", "sphinx-autoapi", "sphinx-rtd-theme", "sphinx-copybutton", "sphinxcontrib-bibtex", "sphinxcontrib-mermaid", "myst-parser", "jupyter-sphinx", "ipykernel"]

[project.scripts]
magnus = "magnus.cli:main"

[project.urls]
Homepage = "https://github.com/mbustama/Magnus"
Repository = "https://github.com/mbustama/Magnus.git"
Issues = "https://github.com/mbustama/Magnus/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's default.  The default selection is not
# stable across ruff releases -- 0.16 widened it, which turned a green CI red overnight on
# a codebase that had not changed -- and a blocking lint whose rule set moves with whatever
# version CI happens to install is not a check, it is a tripwire.  This is the set the
# codebase was cleaned against: pycodestyle errors and Pyflakes.
select = ["E4", "E7", "E9", "F"]

# Two checks flag deliberate, codebase-wide conventions rather than defects.
ignore = [
    # `l` is the standard symbol for position along the neutrino trajectory in the physics
    # this package implements; renaming it everywhere would make the code harder to read
    # against the equations in docs/source/methodology.rst.
    "E741",
    # Single-statement guards on one line (`if save_log: file_log.close()`) are used
    # consistently here, and only ever for short cleanup or clamping statements.
    "E701",
]

[tool.ruff.lint.per-file-ignores]
# The package __init__ deliberately re-exports its submodules; `__all__` is built from a
# list of strings, which ruff cannot connect back to the import statements.
"src/magnus/__init__.py" = ["F401"]
# oscprob re-exports oscprobstd's closed-form helpers at the end of the module, next to
# the `__all__` they belong to rather than at the top.
"src/magnus/oscprob.py" = ["E402"]
# conf.py must extend sys.path before it can import the package's version module.
"docs/source/conf.py" = ["E402"]
# Throwaway lambdas are idiomatic when building a one-off callable for a single assertion.
"tests/*" = ["E731"]
