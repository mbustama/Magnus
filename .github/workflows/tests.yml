name: tests

on:
  push:
    # Development happens on dev and on dev-* topic branches (currently dev-plotting),
    # so those must be covered too -- an exact [main, dev] filter silently skipped every
    # push to dev-plotting.
    branches: [main, dev, "dev-*"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run test suite
        run: pytest tests/ -v
