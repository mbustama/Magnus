name: Documentation Deployment

on:
  push:
    branches: [ "main" ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run and latest queued
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Install magnus (editable)
        # Needed so the jupyter-sphinx kernel that executes the docstring
        # Examples (.. jupyter-execute::) can `import magnus`.
        run: pip install -e .

      - name: Register the Jupyter kernel used by jupyter-sphinx
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Build HTML documentation
        run: |
          cd docs
          make html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload HTML artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Ensure this path matches where Sphinx outputs your HTML files
          path: 'docs/build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
