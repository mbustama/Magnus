name: Code Quality

# Triggers match tests.yml exactly; see the explanation there. In short: a commit is
# checked once, the push-triggered run is what appears on a pull request, and
# pull_request events are kept only so that a fork's branches -- which never fire a push
# event here -- are still covered.
on:
  push:
    # '**' matches every branch, including names containing a slash. It has to be spelled
    # out: a push filter naming only tags (even `tags-ignore: ['**']`) makes GitHub treat
    # the workflow as tag-only and run it for no branch push at all -- which silently
    # disabled every push build here until a pull request showed zero runs. Naming only
    # branches has the mirror effect, which is the intent: tags do not build, since a
    # release tag points at a commit its branch already tested.
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Run Ruff Linter
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        # Checks for logical errors, undefined variables, and unused imports.  The rule
        # selection and the two codebase-wide exemptions (E741 for `l`, E701 for one-line
        # guards) live in [tool.ruff.lint] in pyproject.toml.  This step is blocking: a
        # new finding should fail the build, not be reported into a green checkmark.
        # notebooks/make_notebooks.py is named explicitly rather than the whole
        # directory: the generator is ordinary Python and should be linted, while the
        # .ipynb files it writes legitimately re-import in later cells so a reader can
        # start anywhere, which ruff reads as F811 redefinition.
        run: ruff check src/magnus/ tests/ docs/ notebooks/make_notebooks.py

      - name: Run Ruff Formatter (Check Only)
        # Informational only.  The codebase predates ruff format and is not formatted to
        # its style; reformatting it wholesale would bury real changes in diff noise.
        # Left here so the current gap stays visible without blocking CI.
        run: ruff format --check .
        continue-on-error: true

  cli-docs:
    name: CLI reference is up to date
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install package
        run: pip install -e .

      - name: Check docs/source/cli.rst matches the actual parser
        # docs/source/cli.rst quotes `magnus prob --help` verbatim.  Hand-copied output
        # goes stale the moment a flag is added, so this fails if the page and the parser
        # have diverged; run `python3 docs/regen_cli_help.py` to fix.
        run: python3 docs/regen_cli_help.py --check

  docs:
    name: Documentation builds
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches pages.yml, so what is checked here is what gets deployed.
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Install magnus (editable)
        # jupyter-sphinx executes every `.. jupyter-execute::` block through a real
        # kernel at build time, so the package has to be importable from it.
        run: pip install -e .

      - name: Register the Jupyter kernel used by jupyter-sphinx
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Build HTML documentation
        # Until now the docs were only ever built by pages.yml, which runs on pushes to
        # main -- so a page that failed to build, or dropped out of the sidebar, was not
        # caught until after it had been merged.  This runs the same build on pull
        # requests instead.
        #
        # Stricter than pages.yml on purpose: -W turns Sphinx warnings into errors, which
        # is what catches a broken cross-reference, a page missing from the toctree, or
        # malformed RST.  The deploy build is deliberately left permissive, so a late
        # warning can never be what stops a release from publishing.
        run: |
          cd docs
          # -n (nitpicky) as well as -W: without it Sphinx does not report a
          # cross-reference that resolves to nothing, and several had accumulated
          # silently -- constants, warning classes and type aliases documented in
          # prose but absent from their module's __all__, so autoapi generated no
          # target for them.  conf.py's nitpick_ignore_regex filters the numpydoc
          # type strings that would otherwise make -n unusable as a gate.
          make html SPHINXOPTS="-n -W --keep-going"
