name: Publish to PyPI

# Two entry points, and which one fired decides which index is published to.  Nothing
# selects the target, because nothing needs to: the event is the selector.
#
#   release: published   ->  PyPI.  The real thing.
#   workflow_dispatch    ->  TestPyPI.  A rehearsal, run from the Actions tab.
#
# Triggering the real publish on a published Release rather than on a tag is what makes
# releasing deliberate.  A tag can be pushed by accident; a release is written and published
# on purpose, and it is the same object the changelog entry is attached to.
#
# The rehearsal has no way to reach PyPI and the release has no way to reach TestPyPI, which
# is the entire point of splitting them by event rather than by an input.  The obvious
# alternative -- a `choice` input listing both indexes -- was rejected: it puts a real
# publish one wrong dropdown away, and the version it would upload is unrepeatable.  A knob
# that can do the irreversible thing is worse than no knob.
#
# This replaces a commented-out TestPyPI step.  That arrangement worked but required editing
# this file onto main to rehearse and editing it back afterwards, so a forgotten revert
# would have sent the next real release to TestPyPI -- the exact misfire a rehearsal exists
# to prevent.  Same shape as the sibling project NuOscProbExact, deliberately.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Publishing is irreversible: PyPI does not allow re-uploading a version, even a
  # deleted one.  Everything that can be checked has to be checked before the upload
  # step, not after it, and the push-triggered runs on `main` are not enough on their
  # own -- a release can be cut from any tag, including one whose commit predates a fix
  # or was never pushed to a branch CI watches.
  #
  # This runs for the rehearsal too.  A rehearsal that skips the gate is rehearsing a
  # different workflow from the one that will publish.
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install the package and its test extra
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run the suite
        run: pytest tests/ -q -n auto

  build-and-publish:
    name: Build and publish to ${{ github.event_name == 'release' && 'PyPI' || 'TestPyPI' }}
    needs: test
    runs-on: ubuntu-latest

    # These permissions are required for PyPI Trusted Publisher (OIDC) authentication.
    # The runner exchanges a short-lived GitHub-signed token for an upload token at publish
    # time, so there is no API token stored as a repository secret to leak or rotate.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 3.12, not 3.10.  `tomllib` reads the version below and is stdlib only from 3.11, so
      # on 3.10 this job died with `ModuleNotFoundError: No module named 'tomllib'` -- on the
      # first real release, after the rehearsal had passed.  The interpreter here does not
      # affect the artifact: the package is pure Python and builds `py3-none-any` whatever
      # runs the build, and `requires-python = ">=3.10"` is metadata, not a build constraint.
      # The `test` job above still runs 3.10 deliberately, because that is the floor being
      # promised.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Split from the comparison below, and runs for BOTH events on purpose.
      #
      # It used to be one release-only step, which meant the TestPyPI rehearsal skipped it
      # entirely -- and it was the step that then failed on the first real release.  A
      # rehearsal that cannot reach a step cannot rehearse it.  Reading the version is
      # event-independent, so it now runs every time and the rehearsal exercises the parse;
      # only the tag comparison, which genuinely needs a tag, stays release-only.
      - name: Read the packaged version
        id: pkg
        run: |
          python -m pip install --upgrade pip
          pkg="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "packaged version: $pkg"

      # Nothing ties the tag to the packaging metadata: the tag names the release, the
      # `version` field names the artifact, and they are edited in different places at
      # different times.  Tagging v1.0.0 while pyproject.toml still said 1.0.0rc1 would have
      # published 1.0.0rc1 under a release called 1.0.0, and PyPI would then refuse the real
      # 1.0.0rc1 forever after, because a version cannot be uploaded twice.
      #
      # Release-only: a dispatched run has no tag, and `GITHUB_REF_NAME` is the branch it was
      # started from, so this would compare a branch name against a version and always fail.
      - name: Check the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="${{ steps.pkg.outputs.version }}"
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag '$GITHUB_REF_NAME' does not match pyproject version '$pkg'"
            exit 1
          fi

      - name: Install build tools
        run: pip install build

      - name: Stamp a unique .devN version (rehearsal only)
        # TestPyPI burns version numbers exactly as PyPI does: upload 1.0.0 once and every
        # later attempt at 1.0.0 is refused, permanently, even after the file is deleted.
        # A rehearsal you can only run once is not much of a rehearsal -- the second run,
        # after fixing whatever the first one found, would fail on the version rather than
        # on the thing being tested.
        #
        # So a dispatched build is stamped 1.0.0.devN, where N is the run number and
        # therefore never repeats.  Under PEP 440 a .devN release sorts *below* the release
        # it is derived from, so these can never shadow a real 1.0.0, and `pip install
        # magnuspy` will not pick one up even from TestPyPI without --pre.
        #
        # Only the checkout on the runner is edited.  Nothing is committed, and the release
        # path never reaches this step, so the version that goes to PyPI is always the one
        # written in pyproject.toml.
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path('pyproject.toml')
          text = path.read_text()
          suffix = '.dev' + os.environ['GITHUB_RUN_NUMBER']
          text, count = re.subn(r'(?m)^version = "([^"]+)"$',
                                lambda m: 'version = "%s%s"' % (m.group(1), suffix),
                                text, count=1)
          # If the version line is ever reshaped, fail here rather than silently
          # rehearsing the same number twice and blaming TestPyPI for rejecting it.
          assert count == 1, 'no [project] version line found in pyproject.toml'
          path.write_text(text)
          print('rehearsing as', re.search(r'(?m)^version = "([^"]+)"$', text).group(1))
          PY

      - name: Build the package (sdist and wheel)
        run: python -m build

      # What PyPI will actually render.  A README that fails to parse is not rejected at
      # upload -- it is accepted and then shown as raw text or an error box on the project
      # page, which cannot be fixed without publishing a new version.  `twine` was already
      # in the `dev` extra; it was simply never run.
      - name: Check the artifacts and the rendered description
        run: |
          pip install twine
          twine check --strict dist/*

      - name: Publish package to TestPyPI (rehearsal)
        # The rehearsal, against https://test.pypi.org -- a throwaway index that exists for
        # exactly this.  `twine check` above catches the likeliest release failure, a README
        # the renderer rejects, but it cannot exercise the OIDC exchange, the trusted
        # publisher registration, or the upload itself.  Those are only ever tested by
        # uploading, and on PyPI proper the first test is also the last: a version refused
        # halfway through cannot be retried, only renumbered.
        #
        # Run it from the Actions tab -> "Publish to PyPI" -> "Run workflow".  Nothing needs
        # to be edited, no release is cut, and nothing is left behind to revert.
        #
        # TestPyPI is a separate site with a separate account and its own pending-publisher
        # registration, at https://test.pypi.org/manage/account/publishing/, using the same
        # four values as PyPI: magnuspy, mbustama, Magnus, publish.yml, and an empty
        # environment name.  It also does not mirror PyPI's dependencies, which matters here:
        # numba is a required dependency, so an `pip install` *from* TestPyPI needs
        # `--extra-index-url https://pypi.org/simple/` to resolve it.
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish package to PyPI
        # Reachable only from a published Release.  A manual run cannot get here however the
        # button is pressed, which is what makes the rehearsal above safe to use casually.
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
